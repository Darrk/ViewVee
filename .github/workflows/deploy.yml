name: Server CI and deployment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: viewvee-server-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Do not execute fork PR code on runners with production access.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: |
            api/go.sum
            api/signaling-server/go.sum
      - name: Test API and signaling
        run: |
          (cd api && go test -race ./... && go vet ./...)
          (cd api/signaling-server && go test -race ./... && go vet ./...)
      - name: Test deployment scripts
        run: |
          python3 -m unittest discover -s deploy -p 'test_*.py'
          bash -n deploy/remote-deploy.sh
      - name: Check Docker builds
        if: github.event_name == 'pull_request'
        run: |
          docker build -t viewvee-web:ci api
          docker build -t viewvee-signal:ci api/signaling-server
          docker build -t viewvee-turn:ci api/turn-server

  publish:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: viewvee-web
            context: api
          - image: viewvee-signal
            context: api/signaling-server
          - image: viewvee-turn
            context: api/turn-server
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/specterinteractive/${{ matrix.image }}:latest
            ghcr.io/specterinteractive/${{ matrix.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    needs: publish
    runs-on: [self-hosted, linux, x64]
    environment: production
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate deployment targets
        env:
          VIEWVEE_DEPLOY_TARGETS: ${{ vars.VIEWVEE_DEPLOY_TARGETS }}
        run: python3 deploy/deploy.py --validate
      - name: Prepare SSH credentials
        env:
          SSH_KEY_FILE: ${{ runner.temp }}/viewvee_deploy_key
          SSH_KNOWN_HOSTS_FILE: ${{ runner.temp }}/viewvee_known_hosts
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$EC2_SSH_PRIVATE_KEY" && test -n "$EC2_KNOWN_HOSTS"
          umask 077
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > "$SSH_KEY_FILE"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$SSH_KNOWN_HOSTS_FILE"
      - name: Deploy production
        env:
          VIEWVEE_DEPLOY_TARGETS: ${{ vars.VIEWVEE_DEPLOY_TARGETS }}
          SSH_KEY_FILE: ${{ runner.temp }}/viewvee_deploy_key
          SSH_KNOWN_HOSTS_FILE: ${{ runner.temp }}/viewvee_known_hosts
          DEPLOY_REVISION: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 deploy/deploy.py
      - name: Remove SSH credentials
        if: always()
        run: rm -f -- "${{ runner.temp }}/viewvee_deploy_key" "${{ runner.temp }}/viewvee_known_hosts"
