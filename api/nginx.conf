worker_processes auto;

events {
  worker_connections 8192;
  multi_accept on;
  use epoll;
}

http {

    sendfile on;

    upstream backend1 {
        server backend:8080;
    }

    server {
        listen 80;
	http2 on;
        server_name signal.viewvee.com;

	proxy_buffer_size          512k;
	proxy_buffers              4 256k;
	proxy_busy_buffers_size    512k;
	large_client_header_buffers 4 16k;

        location ^~ /.well-known/acme-challenge/ {
           # No HTTP authentication
           allow all;
           root /var/www/certbot;
        }

        location = /.well-known/acme-challenge/ {
           return 404;
        }

	location = /metrics {
           auth_basic           "Metrics";
           auth_basic_user_file /etc/nginx/.htpasswd;
           proxy_pass         http://backend1;
        }

        location / {
            proxy_pass         http://backend1;
            proxy_redirect     off;
            proxy_http_version 1.1;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection keep-alive;
            proxy_set_header   Host $http_host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host $server_name;

        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
	http2 on;
        server_name signal.viewvee.com;

	proxy_buffer_size          512k;
        proxy_buffers              4 256k;
        proxy_busy_buffers_size    512k;
        large_client_header_buffers 4 16k;


        ssl_certificate /etc/letsencrypt/live/signal.viewvee.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/signal.viewvee.com/privkey.pem;

        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        location ^~ /.well-known/acme-challenge/ {
           # No HTTP authentication
           allow all;
           root /var/www/certbot;
        }

        location = /.well-known/acme-challenge/ {
           return 404;
        }

        location = /metrics {
           auth_basic           "Metrics";
           auth_basic_user_file /etc/nginx/.htpasswd;
           proxy_pass         http://backend1;
        }

	location ~ ^/(baby-monitor|viewvee)/ws$ {
            proxy_pass         http://backend1;
            proxy_redirect     off;
	    proxy_http_version 1.1;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "Upgrade";
            proxy_set_header   Host $http_host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host $server_name;
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
            proxy_buffering    off;

        }


        location / {
            proxy_pass         http://backend1;
            proxy_redirect     off;
            proxy_http_version 1.1;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection keep-alive;
            proxy_set_header   Host $http_host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host $server_name;

        }
    }
}

